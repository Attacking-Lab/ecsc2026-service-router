[project]
name = "checker"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cryptography>=44",
    "enochecker-core>=0.22.0",
    "enochecker3>=0.22.2",
    "pyelftools>=0.33",
    "pyyaml>=6.0.3",
]

[tool.uv]
# enochecker3 and enochecker-test source enochecker-core from `branch = "main"`,
# which would otherwise land in the lock as a moving branch reference. Override
# it with the same tag the source below pins.
override-dependencies = [
    "enochecker-core @ git+https://github.com/Attacking-Lab/enochecker-core@v0.22.0",
]

[tool.uv.sources]
enochecker-core = { git = "https://github.com/Attacking-Lab/enochecker-core", rev = "v0.22.0" }
enochecker3 = { git = "https://github.com/Attacking-Lab/enochecker3", rev = "v0.22.3-public" }
enochecker-test = { git = "https://github.com/Attacking-Lab/enochecker-test", rev = "v0.22.0-public" }
enochecker-cli = { git = "https://github.com/Attacking-Lab/enochecker-cli", rev = "v0.22.0-public" }

[dependency-groups]
dev = [
    "enochecker-cli>=0.21.0",
    "enochecker-test>=0.21.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
extend-select = [
    "B",
    "I",
    "UP",
]
