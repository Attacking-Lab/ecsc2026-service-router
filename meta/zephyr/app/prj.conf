# Hardware
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_HEAP_MEM_POOL_SIZE=16777216
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
CONFIG_PCIE_ECAM=y
CONFIG_VIRTIO=y

# Threads
CONFIG_DYNAMIC_OBJECTS=y
CONFIG_DYNAMIC_THREAD=y
CONFIG_DYNAMIC_THREAD_ALLOC=y
CONFIG_EXECUTE_XOR_WRITE=n
CONFIG_MAX_THREAD_BYTES=48
CONFIG_THREAD_NAME=y
CONFIG_USERSPACE=y
CONFIG_XTENSA_MMU_FLUSH_AUTOREFILL_DTLBS_ON_SWAP=y
CONFIG_XTENSA_MMU_FLUSH_AUTOREFILL_ITLBS_ON_SWAP=y
CONFIG_XTENSA_USER_STACK_EXECUTABLE=y

# Syscalls
#   atmlab: our own
#   zephyr: stdio
#   thread_abort: automatically called at exit
#   sched_current_thread_query: called by k_is_user_context
CONFIG_SYSCALL_FILTER=".*(atmlab|zephyr|thread_abort|sched_current_thread_query).*"
CONFIG_APPLICATION_DEFINED_SYSCALL=y

# CoAP
# CONFIG_COAP requires CONFIG_NETWORKING but we don't use that, so CONFIG_NET_NATIVE=n
# The RNG is there to provide sys_rand_get to coap_next_token, but never actually used.
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_COAP=y
CONFIG_COAP_URI_WILDCARD=n
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# cry(ptogrpahy)
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_AES_ROM_TABLES=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_MBEDTLS_CIPHER_AES_ENABLED=y
CONFIG_MBEDTLS_CIPHER_MODE_CTR_ENABLED=y
CONFIG_MBEDTLS_CMAC=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=4096

# memory management is a myth invented by the ram industry to sell you more ram
CONFIG_XTENSA_MMU_NUM_L1_TABLES=252
CONFIG_XTENSA_MMU_NUM_L2_TABLES=2048
CONFIG_KERNEL_VM_SIZE=0x6000000

# Stacks
CONFIG_ISR_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_XTENSA_USER_FAULT_BAILOUT_STACK_SIZE=2048

# Debugging
CONFIG_STRIP_APP_SYMBOLS=n
CONFIG_EARLY_CONSOLE=y
CONFIG_KERNEL_LOG_LEVEL_ERR=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=4
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_MODE_IMMEDIATE=n
CONFIG_LOG_RUNTIME_DEFAULT_LEVEL=1
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_XTENSA_SIM_CONSOLE=y
